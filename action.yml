name: Zyven Watch scan
description: >-
  Scans the checked-out repository with zyven-scanner and sends its SBOM, dependency scope and
  deployment facts to Zyven Watch. Source code stays in the runner.
inputs:
  product:
    description: The product id in Zyven Watch.
    required: true
  version:
    description: The version label, e.g. the release tag; created on its first scan.
    required: true
  api-url:
    description: The Zyven Watch API, e.g. https://zyven.example/api/v1.
    required: true
  api-key:
    description: An API key with the upload scope.
    required: true
  released:
    description: Mark a version this scan creates as released.
    default: 'false'
  path:
    description: The directory to scan, relative to the workspace.
    default: '.'
  image:
    description: The scanner image.
    default: ghcr.io/zyvenlabs/zyven-scanner:0.1
runs:
  using: composite
  steps:
    - shell: bash
      # Inputs reach the script as environment variables, never spliced into it.
      env:
        ZYVEN_API_KEY: ${{ inputs.api-key }}
        ZYVEN_API_URL: ${{ inputs.api-url }}
        PRODUCT: ${{ inputs.product }}
        VERSION: ${{ inputs.version }}
        RELEASED: ${{ inputs.released }}
        SCAN_PATH: ${{ inputs.path }}
        IMAGE: ${{ inputs.image }}
      run: |
        args=(--product "$PRODUCT" --version "$VERSION")
        if [ "$RELEASED" = "true" ]; then args+=(--released); fi
        docker run --rm -e ZYVEN_API_KEY -e ZYVEN_API_URL -e GITHUB_REF -e GITHUB_SHA \
          -v "$GITHUB_WORKSPACE/$SCAN_PATH:/src:ro" "$IMAGE" /src "${args[@]}"
